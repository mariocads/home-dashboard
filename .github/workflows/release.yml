name: Release Images

# Baut die Container-Images und legt sie in der GitHub Container Registry ab.
# Der Server holt sie per deploy.sh (Pull), kein Runner im Heimnetz.
# Multi-Arch: amd64 (ThinkCentre) und arm64 (Raspberry Pi) unter demselben Tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, collector]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      # Erst lokal bauen und scannen (amd64; arm64 hat dieselben Alpine- und npm-Pakete),
      # nur ein sauberes Image wird gepusht.
      - name: Build (lokal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: local/${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Trivy-Scan (kritische/hohe Schwachstellen)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.app }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
